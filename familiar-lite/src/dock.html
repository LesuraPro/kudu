<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'" />
    <link rel="stylesheet" href="theme.css" />
    <style>
      body {
        height: 100vh;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding-bottom: 8px;
      }
      #dock {
        display: flex;
        align-items: flex-end;
        gap: 6px;
        padding: 6px 10px;
        border-radius: 20px;
      }
      .item {
        position: relative;
        width: 52px;
        height: 52px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 12px;
        cursor: pointer;
        /* Увеличение при наведении как в macOS */
        transition: width 0.15s ease, height 0.15s ease, margin 0.15s ease;
      }
      .item img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
      .item .letter {
        width: 100%;
        height: 100%;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        font-weight: 600;
        color: white;
        background: linear-gradient(135deg, #5b5bd6, #e5484d);
      }
      .item .tip {
        position: absolute;
        bottom: calc(100% + 10px);
        left: 50%;
        transform: translateX(-50%);
        white-space: nowrap;
        padding: 3px 9px;
        font-size: 12px;
        border-radius: 6px;
        background: var(--glass-strong);
        border: 1px solid var(--border);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.1s;
      }
      .item:hover .tip { opacity: 1; }
      .item.drop-target { outline: 2px dashed var(--accent); outline-offset: 2px; }
      .divider { width: 1px; align-self: stretch; margin: 6px 4px; background: var(--border); }
      .item.system .letter { background: var(--hover); color: var(--text); font-size: 20px; }
    </style>
  </head>
  <body>
    <div id="dock" class="glass"></div>
    <script src="dock.js"></script>
  </body>
</html>
