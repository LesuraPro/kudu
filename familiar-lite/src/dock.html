<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'" />
    <link rel="stylesheet" href="theme.css" />
    <style>
      body {
        height: 100vh;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding-bottom: 8px;
      }
      #dock {
        display: flex;
        align-items: flex-end;
        gap: 6px;
        padding: 7px 10px;
        border-radius: 22px;
      }
      .item {
        position: relative;
        width: 52px;
        height: 52px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 12px;
        cursor: pointer;
        /* Увеличение при наведении как в macOS */
        transition: width 0.15s ease, height 0.15s ease, margin 0.15s ease;
      }
      .item img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
      .item .letter {
        width: 100%;
        height: 100%;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        font-weight: 600;
        color: var(--text);
        background: var(--bg-strong);
        border: 1px solid var(--border);
      }
      .item .tip {
        position: absolute;
        bottom: calc(100% + 10px);
        left: 50%;
        white-space: nowrap;
        padding: 4px 10px;
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        border-radius: 999px;
        background: var(--bg-strong);
        border: 1px solid var(--border);
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, 4px);
        transition: opacity 0.15s, transform 0.25s cubic-bezier(0.34, 1.45, 0.5, 1);
      }
      .item:hover .tip { opacity: 1; transform: translate(-50%, 0); }
      .item.drop-target { outline: 2px dashed var(--accent); outline-offset: 2px; }
      .divider { width: 1px; align-self: stretch; margin: 6px 4px; background: var(--border); }
      .item.system .letter { background: var(--hover); font-size: 20px; }
      /* Индикатор запущенного приложения; у активного — красная чёрточка */
      .item .run {
        position: absolute;
        bottom: -6px;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: var(--text);
        transition: width 0.25s, background 0.25s;
      }
      .item .run.front { width: 12px; border-radius: 2px; background: var(--accent); }

      /* «Веер» папки: всплывает из иконки с пружинкой */
      #stack {
        position: absolute;
        width: 380px;
        max-height: 330px;
        padding: 12px;
        border-radius: 20px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        transform-origin: var(--arrow, 50%) 100%;
        transform: translateY(24px) scale(0.4);
        opacity: 0;
        pointer-events: none;
        transition: transform 0.45s cubic-bezier(0.34, 1.45, 0.5, 1), opacity 0.2s;
      }
      #stack.open { transform: none; opacity: 1; pointer-events: auto; }
      #stack::after {
        content: '';
        position: absolute;
        bottom: -6px;
        left: calc(var(--arrow, 50%) - 6px);
        width: 12px;
        height: 12px;
        transform: rotate(45deg);
        background: var(--bg);
        border-right: 1px solid var(--border);
        border-bottom: 1px solid var(--border);
      }
      .stack-head { display: flex; justify-content: space-between; align-items: center; padding: 0 4px; }
      .stack-head span { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
      .stack-head button { font-size: 10px; color: var(--muted); }
      .stack-head button:hover { color: var(--text); }
      .stack-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; overflow-x: hidden; overflow-y: auto; }
      .stack-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 8px 2px;
        border-radius: 10px;
        font-family: var(--sans);
        font-size: 10px;
        animation: fly 0.4s cubic-bezier(0.34, 1.45, 0.5, 1) both;
      }
      #stack:not(.open) .stack-item { animation: none; }
      .stack-item:hover { background: var(--hover); }
      .stack-item span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .stack-icon { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; font-size: 24px; color: var(--muted); }
      .stack-icon img { width: 100%; height: 100%; object-fit: contain; }
      .stack-empty, .stack-more { font-size: 11px; color: var(--muted); text-align: center; padding: 4px; }
      @keyframes fly { from { opacity: 0; transform: translateY(30px) scale(0.5); } }
    </style>
  </head>
  <body>
    <div id="stack" class="glass"></div>
    <div id="dock" class="glass"></div>
    <script src="dock.js"></script>
  </body>
</html>
