<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <link rel="stylesheet" href="theme.css" />
    <style>
      html, body { width: 100%; height: 100%; }
      body { display: flex; align-items: center; justify-content: center; }
      #ring { width: 420px; height: 420px; overflow: visible; }
      #ring.show { animation: ring-in 0.42s var(--spring) both; }
      #ring.swap { animation: ring-swap 0.4s var(--spring) both; }
      @keyframes ring-in { from { opacity: 0; transform: scale(0.55) rotate(-25deg); } }
      @keyframes ring-swap { from { opacity: 0.2; transform: scale(0.85) rotate(40deg); } }

      /* Меню всегда тёмное (оно поверх чего угодно): сектора — тушь с лунной кромкой,
         под курсором — светящийся малиновый клинок. Цвета — из палитры (--ink-*, --accent) */
      body { background: radial-gradient(circle at center, color-mix(in srgb, var(--ink-text) 9%, transparent) 0, transparent 68%); }
      .slice path {
        fill: color-mix(in srgb, var(--ink) 92%, transparent);
        stroke: var(--ink-line);
        stroke-width: 1;
        transition: fill 0.15s, filter 0.2s;
      }
      .slice .icon circle { fill: var(--ink-text); transition: fill 0.15s; }
      .slice text {
        fill: var(--ink-dim);
        font: 600 11px var(--mono);
        letter-spacing: 0.08em;
        text-anchor: middle;
        text-transform: uppercase;
        transition: fill 0.15s;
      }
      .slice.format text { font-size: 15px; fill: var(--ink-text); letter-spacing: 0.12em; }
      .slice { animation: slice-in 0.35s var(--spring) both; transform-origin: 210px 210px; }
      @keyframes slice-in { from { opacity: 0; transform: scale(0.7); } }
      .slice.hot path { fill: var(--accent); stroke: color-mix(in srgb, #fff 40%, var(--accent)); filter: drop-shadow(0 0 10px var(--accent-glow)); }
      .slice.hot text { fill: var(--on-accent); }
      .slice.hot .icon circle { fill: var(--on-accent); }

      .hub circle.disc { fill: color-mix(in srgb, var(--ink) 96%, transparent); stroke: var(--ink-line); transition: stroke 0.2s; }
      .hub.hot circle.disc { stroke: var(--accent); }
      .hub text { text-anchor: middle; font-family: var(--mono); }
      .hub .file { fill: var(--ink-dim); font-size: 10px; }
      .hub .hint { fill: var(--ink-muted); font-size: 9px; letter-spacing: 0.08em; }
      .hub .hint.tip { fill: var(--petal); }
      .dotline circle { fill: var(--ink-text); }
      .dotline circle.off { fill: color-mix(in srgb, var(--ink-text) 12%, transparent); }
    </style>
  </head>
  <body>
    <svg id="ring" viewBox="0 0 420 420"></svg>
    <script src="dotmatrix.js"></script>
    <script src="radial.js"></script>
  </body>
</html>
