<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'" />
    <link rel="stylesheet" href="theme.css" />
    <style>
      body { padding: 16px; }
      #box { border-radius: 16px; overflow: hidden; }
      #q {
        width: 100%;
        padding: 16px 18px;
        font: inherit;
        font-size: 20px;
        color: var(--text);
        background: transparent;
        border: none;
        outline: none;
      }
      #list { max-height: 300px; overflow-y: auto; border-top: 1px solid var(--border); }
      #list:empty { display: none; }
      .row { display: flex; align-items: center; gap: 12px; padding: 8px 18px; cursor: pointer; }
      .row.active { background: var(--hover); }
      .row img, .row .ph { width: 28px; height: 28px; flex: none; }
      .row .ph { border-radius: 6px; background: var(--hover); }
      .row .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .row .kind { font-size: 12px; color: var(--muted); }
      #hint { padding: 6px 18px 10px; font-size: 12px; color: var(--muted); }
    </style>
  </head>
  <body>
    <div id="box" class="glass">
      <input id="q" placeholder="Приложения и файлы…" autocomplete="off" spellcheck="false" />
      <div id="list"></div>
      <div id="hint">Enter — открыть · Ctrl+Enter — закрепить в доке · Esc — закрыть</div>
    </div>
    <script src="launcher.js"></script>
  </body>
</html>
