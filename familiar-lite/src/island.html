<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'" />
    <link rel="stylesheet" href="theme.css" />
    <style>
      /* Свёрнутая пилюля помещается в верхнюю панель (30px) */
      body { height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding-top: 2px; }

      /* Остров всегда тёмный — как вырез в экране; оттенок — «чернила» из палитры */
      #island {
        --spring: cubic-bezier(0.34, 1.45, 0.5, 1);
        position: relative;
        width: 210px;
        height: 26px;
        border-radius: 13px;
        background: var(--ink);
        color: var(--ink-text);
        border: 1px solid var(--ink-line);
        /* Тень помещается в 20px запаса по бокам окна, иначе край окна её обрежет */
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.45);
        overflow: hidden;
        transition: width 0.55s var(--spring), height 0.55s var(--spring), border-radius 0.55s var(--spring);
        cursor: default;
      }
      #island.open { width: 440px; height: 214px; border-radius: 30px; }

      /* Свёрнутое состояние */
      #mini {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 12px;
        transition: opacity 0.2s, transform 0.35s;
      }
      #island.open #mini { opacity: 0; transform: scale(0.9); pointer-events: none; }
      #miniArt { width: 18px; height: 18px; flex: none; border-radius: 5px; background: color-mix(in srgb, var(--ink-text) 8%, var(--ink)) center/cover; }
      #miniArt.empty { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin: 0 7px; box-shadow: 0 0 8px var(--accent-glow); }
      /* Края бегущей строки растворяются, а не обрезаются */
      #miniDots { flex: 1; height: 14px; -webkit-mask-image: linear-gradient(90deg, transparent, #000 14px, #000 calc(100% - 14px), transparent); }

      /* Эквалайзер из точек */
      .eq { display: flex; gap: 3px; align-items: center; height: 16px; flex: none; }
      /* Полоски фиксированной высоты «прыгают» через scaleY: это анимирует видеокарта,
         без пересчёта раскладки на каждом кадре (как было бы с height) */
      .eq i { display: block; width: 3px; height: 14px; border-radius: 2px; background: var(--ink-text); transform: scaleY(0.25); }
      .eq i:nth-child(2) { background: var(--accent); box-shadow: 0 0 6px var(--accent-glow); }

      /* Развёрнутое состояние */
      #full {
        position: absolute;
        inset: 0;
        padding: 16px 22px;
        display: flex;
        flex-direction: column;
        opacity: 0;
        transform: translateY(-8px);
        transition: opacity 0.2s, transform 0.4s var(--spring);
        pointer-events: none;
      }
      #island.open #full { opacity: 1; transform: none; pointer-events: auto; transition-delay: 0.12s; }

      .tabs { display: flex; gap: 18px; font-size: 12px; font-family: var(--sans); }
      .tabs button { color: var(--ink-muted); padding: 0; }
      .tabs button.active { color: var(--ink-text); font-weight: 600; }
      .tabs .spacer { flex: 1; }
      #theme { color: var(--ink-dim); font-size: 14px; line-height: 1; padding: 0 4px; }
      #theme:hover { color: var(--ink-text); }

      .page { display: none; flex: 1; }
      .page.active { display: flex; }

      #music { flex-direction: column; justify-content: space-between; padding-top: 12px; }
      .track { display: flex; gap: 16px; align-items: center; }
      #art {
        width: 84px;
        height: 84px;
        flex: none;
        border-radius: 14px;
        background: color-mix(in srgb, var(--ink-text) 6%, var(--ink)) center/cover;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #art canvas { width: 60px; height: 60px; }
      .meta { flex: 1; min-width: 0; font-family: var(--sans); }
      .swap #art { animation: flip 0.6s var(--spring); }
      .swap .meta { animation: slide 0.5s var(--spring); }
      @keyframes flip { from { transform: perspective(300px) rotateY(-90deg); opacity: 0; } }
      @keyframes slide { from { transform: translateX(16px); opacity: 0; } }
      #app { font-size: 11px; color: var(--ink-muted); }
      #title { font-size: 17px; font-weight: 600; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #artist { font-size: 13px; color: var(--ink-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .controls { display: flex; align-items: center; gap: 14px; margin-top: 8px; }
      .controls button { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
      .controls button:hover { background: var(--ink-line); }
      .controls #play { width: 36px; height: 36px; background: var(--ink-line); }
      .controls #play:hover { background: var(--accent); box-shadow: 0 0 14px var(--accent-glow); }
      .controls button { transition: background-color 0.2s, box-shadow 0.2s; }
      .controls svg { width: 16px; height: 16px; fill: var(--ink-text); }

      .progress { display: flex; align-items: center; gap: 10px; font-size: 10px; color: var(--ink-muted); }
      .bar { flex: 1; height: 3px; border-radius: 2px; background: color-mix(in srgb, var(--ink-text) 12%, transparent); position: relative; }
      /* Пройденная часть — светящийся клинок */
      .bar i { position: absolute; inset: 0 auto 0 0; border-radius: 2px; background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 40%, transparent), var(--accent)); box-shadow: 0 0 8px var(--accent-glow); }
      .bar i::after {
        content: '';
        position: absolute;
        right: -4px;
        top: -3px;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--ink-text);
      }

      .footer { display: flex; justify-content: space-between; font-size: 10px; color: var(--ink-muted); letter-spacing: 0.06em; }
      .footer button { color: inherit; padding: 0; }
      .footer button:hover { color: var(--ink-text); }

      #devices { flex-direction: column; justify-content: center; gap: 12px; padding-top: 10px; }
      #btDevices { display: flex; flex-direction: column; gap: 12px; }
      .device { display: flex; align-items: center; gap: 14px; font-family: var(--sans); font-size: 14px; }
      .device .cells { display: flex; gap: 3px; }
      .device .cells i { width: 7px; height: 14px; border-radius: 2px; background: color-mix(in srgb, var(--ink-text) 12%, transparent); }
      .device .cells i.on { background: var(--ink-text); }
      .device .cells i.low { background: var(--accent); }
      .device small { color: var(--ink-muted); }
    </style>
  </head>
  <body>
    <div id="island">
      <div id="mini">
        <div id="miniArt" class="empty"></div>
        <canvas id="miniDots"></canvas>
        <div class="eq"><i></i><i></i><i></i><i></i></div>
      </div>

      <div id="full">
        <div class="tabs">
          <button data-page="music" class="active">Музыка</button>
          <button data-page="devices">Устройства</button>
          <span class="spacer"></span>
          <button id="theme" title="Светлая / тёмная тема">☾</button>
          <div class="eq"><i></i><i></i><i></i><i></i></div>
        </div>

        <div class="page active" id="music">
          <div class="track">
            <div id="art"><canvas id="artDots"></canvas></div>
            <div class="meta">
              <div id="app">—</div>
              <div id="title">Ничего не играет</div>
              <div id="artist">Включи музыку в любом плеере</div>
              <div class="controls">
                <button id="prev" title="Назад"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z" /></svg></button>
                <button id="play" title="Пауза/играть"><svg viewBox="0 0 24 24"><path id="playIcon" d="M7 5v14l12-7z" /></svg></button>
                <button id="next" title="Вперёд"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z" /></svg></button>
              </div>
            </div>
          </div>
          <div class="progress"><span id="pos">0:00</span><div class="bar"><i id="fill"></i></div><span id="dur">0:00</span></div>
          <div class="footer">
            <span id="date"></span>
            <button id="remindersBtn"></button>
          </div>
        </div>

        <div class="page" id="devices">
          <div class="device" id="battery">
            <div class="cells"></div>
            <div><div id="batteryName">Этот компьютер</div><small id="batteryText">Нет данных о батарее</small></div>
          </div>
          <!-- Bluetooth-устройства с зарядом (наушники, мышки) дорисовывает island.js -->
          <div id="btDevices"></div>
        </div>
      </div>
    </div>

    <script src="dotmatrix.js"></script>
    <script src="power.js"></script>
    <script src="media.js"></script>
    <script src="island.js"></script>
  </body>
</html>
